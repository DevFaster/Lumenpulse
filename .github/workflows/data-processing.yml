name: Data Processing CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/data-processing/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/data-processing/**'
      - 'apps/data-processing/.ci-trigger'

jobs:
  data-processing-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/data-processing

    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379


    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Wait for Redis to be ready
      run: |
        sudo apt-get update && sudo apt-get install -y redis-tools
        for i in $(seq 1 30); do
          if redis-cli -h localhost ping | grep -q PONG; then
            echo "Redis is up"
            break
          fi
          echo "Waiting for Redis..."
          sleep 1
        done

    - name: Test with pytest
      if: env.SKIP_TESTS != 'true'
      # Checks if tests folder exists before running to prevent failure on empty repo
      run: |
        if [ -d "tests" ]; then
          pytest
        else
          echo "No tests directory found, skipping pytest"
        fi
